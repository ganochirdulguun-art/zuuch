<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зууч — үл хөдлөхийн систем</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F3F6FC; --surface:#FFFFFF; --surface-2:#EAEFF9;
  --ink:#131A2B; --muted:#58627A; --accent:#2563EB; --accent-ink:#FFFFFF;
  --accent-2:#C2560F; --line:#DBE2F1; --ok:#2563EB; --warn:#C2560F;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#0C1322; --surface:#141C2E; --surface-2:#1B2438;
    --ink:#E6ECF7; --muted:#93A0BC; --accent:#38BDF8; --accent-ink:#08131F;
    --accent-2:#E0975E; --line:#29324A; --ok:#38BDF8; --warn:#E0975E;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.55}
button{font-family:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.small{padding:3px 10px;font-size:12.5px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font-family:inherit;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:3px;letter-spacing:.03em}
.field{margin-bottom:12px}
h1,h2,h3{font-family:"Montserrat","Segoe UI",sans-serif;font-weight:500}
[hidden]{display:none!important}

/* Нэвтрэлт */
#login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:36px 34px;width:360px}
.login-card h1{font-size:26px;margin:0 0 4px}
.login-card h1 span{color:var(--accent)}
.login-card .sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.login-demo{margin-top:16px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
.err{color:var(--accent-2);font-size:13px;margin-top:8px;min-height:18px}

/* Апп бүтэц */
#app-view{display:flex;min-height:100vh}
aside{width:212px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:20px 0;display:flex;flex-direction:column}
.brand{font-family:"Montserrat",sans-serif;font-weight:700;font-size:19px;padding:0 20px 18px;border-bottom:1px solid var(--line)}
.brand span{color:var(--accent)}
nav.menu{display:flex;flex-direction:column;padding:12px 10px;gap:2px;flex:1}
nav.menu button{border:1px solid transparent;background:none;text-align:left;padding:9px 12px;border-radius:8px;font-size:14.5px;color:var(--muted);transition:transform .16s ease, box-shadow .16s ease, background .16s ease, border-color .16s ease}
nav.menu button:hover{background:var(--surface-2);color:var(--ink);transform:translateX(2px)}
nav.menu button.active{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 78%, #000));color:var(--accent-ink);font-weight:600;transform:translateX(4px);box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 40%, transparent);border-color:color-mix(in srgb,var(--accent) 60%, transparent)}
.userbox{padding:14px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.userbox b{color:var(--ink);display:block}
main{flex:1;padding:26px 30px;min-width:0}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:21px;margin:0}
.demo-note{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:3px 10px}

/* Хүснэгт, картууд */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease}
.tile:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 16%, transparent)}
.tile .v{font-family:"Montserrat",sans-serif;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.tile .k{font-size:12px;color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.card h3{font-size:14px;margin:0 0 10px;font-family:"Inter",sans-serif;font-weight:700}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;white-space:nowrap}
th,td{padding:8px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge.ok{background:color-mix(in srgb, var(--ok) 15%, transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb, var(--warn) 15%, transparent);color:var(--warn)}
.badge.mut{background:var(--surface-2);color:var(--muted)}
.score{font-weight:700;color:var(--accent)}

/* Модал */
.modal-back{position:fixed;inset:0;background:rgba(10,15,12,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px 26px;width:640px;max-width:100%}
.modal h3{margin:0 0 16px;font-size:17px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .wide{grid-column:1/-1}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.hint-card{grid-column:1/-1;background:var(--surface-2);border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.hint-card b{color:var(--accent)}
.subscores{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.subscores span{font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted)}

@media(max-width:760px){
  #app-view{flex-direction:column}
  aside{width:100%;flex-direction:row;align-items:center;padding:8px 10px}
  .brand{border:none;padding:0 12px}
  nav.menu{flex-direction:row;overflow-x:auto;padding:0}
  .userbox{display:none}
  main{padding:16px}
  .form-grid{grid-template-columns:1fr}
  .col-grid{grid-template-columns:1fr!important}
}
</style>
</head>
<body>

<div id="login-view">
  <form class="login-card" id="login-form">
    <h1>«Зууч» <span>🏙️</span></h1>
    <p class="sub">Үл хөдлөх хөрөнгийн ухаалаг систем</p>
    <div class="field"><label>Нэвтрэх нэр</label><input id="login-user" autocomplete="username" required></div>
    <div class="field"><label>Нууц үг</label><input id="login-pass" type="password" autocomplete="current-password" required></div>
    <button class="primary" style="width:100%">Нэвтрэх</button>
    <div class="err" id="login-err"></div>
    <div class="login-demo">Шинэ компани уу? <a href="#" id="to-register" style="color:var(--accent);font-weight:600">Энд бүртгүүлэх →</a><br><br>
      Туршилтын эрх (нууц үг: <code>zuuch2026</code>): <b>zahiral</b> · <b>agent1</b> · <b>agent2</b></div>
  </form>

  <form class="login-card" id="register-form" hidden>
    <h1>Компани бүртгүүлэх</h1>
    <p class="sub">Агентлагаа бүртгээд шууд эхэл — үнэгүй туршилт</p>
    <div class="field"><label>Компанийн нэр</label><input id="reg-company" required></div>
    <div class="field"><label>Таны нэр (захирал)</label><input id="reg-name" required></div>
    <div class="field"><label>Нэвтрэх нэр (3+ тэмдэгт)</label><input id="reg-user" autocomplete="username" required></div>
    <div class="field"><label>Нууц үг (6+ тэмдэгт)</label><input id="reg-pass" type="password" autocomplete="new-password" required></div>
    <div class="field"><label>Утас (заавал биш)</label><input id="reg-phone"></div>
    <button class="primary" style="width:100%">Бүртгүүлэх ба эхлэх</button>
    <div class="err" id="reg-err"></div>
    <div class="login-demo"><a href="#" id="to-login" style="color:var(--accent);font-weight:600">← Нэвтрэх рүү буцах</a></div>
  </form>
</div>

<div id="app-view" hidden>
  <aside>
    <div class="brand">«Зууч»<span>.</span></div>
    <nav class="menu" id="menu">
      <button data-view="dashboard" class="active">📊 Хянах самбар</button>
      <button data-view="properties">🏢 Объект</button>
      <button data-view="clients">👥 Харилцагч</button>
      <button data-view="requests">📋 Хүсэлт</button>
      <button data-view="deals">🤝 Хэлцэл</button>
      <button data-view="market">📈 Зах зээл</button>
      <button data-view="collector">🤖 Цуглуулагч</button>
      <button data-view="team" id="menu-team" hidden>⚙️ Баг</button>
      <button data-view="owner" id="menu-owner" hidden>👑 Эзэн самбар</button>
    </nav>
    <div class="userbox"><b id="user-company" style="color:var(--accent);font-size:12px"></b><b id="user-name"></b><span id="user-role"></span><br>
      <button class="small" style="margin-top:8px" onclick="pwForm()">Нууц үг</button>
      <button class="small" style="margin-top:8px" onclick="logout()">Гарах</button></div>
  </aside>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Virtual POV Tour — Зууч</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --accent:#2563EB; --ink:#0f172a; --bg:#0b1220; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:#fff; font-family:Inter,system-ui,sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; display:block; touch-action:none; }
  .top { position:fixed; top:0; left:0; right:0; padding:10px 14px; display:flex; align-items:center; gap:10px; background:linear-gradient(180deg,rgba(11,18,32,.85),rgba(11,18,32,0)); pointer-events:none; }
  .top > * { pointer-events:auto; }
  .brand { font-family:Montserrat,sans-serif; font-weight:700; letter-spacing:.3px; color:#fff; text-decoration:none; }
  .brand b { color:#60a5fa; }
  .title { font-size:13px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sp { flex:1; }
  button, .btn { border:1px solid rgba(255,255,255,.25); background:rgba(15,23,42,.65); color:#fff; border-radius:8px; padding:7px 11px; font:600 12.5px Inter,sans-serif; cursor:pointer; backdrop-filter:blur(6px); }
  button.on { background:var(--accent); border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  .room { position:fixed; left:14px; bottom:14px; background:rgba(15,23,42,.7); border:1px solid rgba(255,255,255,.18); border-radius:10px; padding:8px 12px; backdrop-filter:blur(6px); min-width:150px; }
  .room .n { font-family:Montserrat,sans-serif; font-weight:700; font-size:15px; }
  .room .a { font-size:12px; opacity:.75; }
  #map { position:fixed; right:14px; bottom:14px; width:220px; height:170px; background:rgba(15,23,42,.75); border:1px solid rgba(255,255,255,.18); border-radius:10px; backdrop-filter:blur(6px); cursor:pointer; }
  .help { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); font-size:12px; opacity:.7; background:rgba(15,23,42,.55); padding:6px 10px; border-radius:8px; white-space:nowrap; }
  .pad { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); display:none; gap:10px; }
  .pad button { width:56px; height:48px; font-size:20px; }
  @media (pointer:coarse) { .pad { display:flex; } .help { display:none; } #map { width:150px; height:120px; } }
  #photos { position:fixed; inset:0; background:rgba(11,18,32,.92); display:none; overflow:auto; padding:60px 16px 20px; z-index:5; }
  #photos .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; max-width:1100px; margin:0 auto; }
  #photos img { width:100%; border-radius:8px; display:block; }
  #photos .x { position:fixed; top:12px; right:14px; }
  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; background:var(--bg); z-index:9; font-size:14px; }
  .spin { width:34px; height:34px; border:3px solid rgba(255,255,255,.2); border-top-color:#60a5fa; border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .35s; z-index:4; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <a class="brand" href="/">Зууч<b>.</b></a>
  <span class="title" id="title">Virtual POV Tour</span>
  <span class="sp"></span>
  <button id="bAuto" class="on">▶ Автомат аялал</button>
  <button id="bFree">🧭 Өөрөө явах</button>
  <button id="bPhotos" disabled>📷 Зураг</button>
  <button id="bPano" style="display:none">360° панорам</button>
  <button id="bFurn" class="on" title="Тавилгын санал (жишиг) асаах/унтраах">🪑 Тавилга</button>
  <button id="bFull">⤢</button>
</div>
<div class="room"><div class="n" id="rName">—</div><div class="a" id="rArea"></div></div>
<canvas id="map" width="440" height="340"></canvas>
<div class="help">Чирж хар · W/A/S/D эсвэл сумаар яв · план дээр өрөө дарж очно</div>
<div class="pad"><button data-k="a">◀</button><button data-k="w">▲</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
<div id="photos"><button class="x" id="bClosePhotos">✕ Хаах</button><div class="grid" id="photoGrid"></div></div>
<div class="fade" id="fade"></div>
<div id="load"><div class="spin"></div><div>Аялал бэлдэж байна…</div></div>
<script type="importmap">{"imports":{"three":"/vendor/three.module.min.js"}}</script>
<script type="module" src="/tour.js"></script>
</body>
</html>
